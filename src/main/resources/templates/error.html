<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>요청을 확인해 주세요</title>
    <link rel="stylesheet" th:href="@{/style.css}">
  </head>
  <body>
    <main class="error-page">
      <p class="eyebrow">작은 웹 연습</p>
      <h1>요청을 처리하지 못했어요.</h1>
      <p class="error" role="alert">오류 <span th:text="${status}">404</span> · 요청 주소와 구현 상태를 확인해 주세요.</p>
      <p>아직 구현하지 않은 동작인지 README에서 확인해 주세요.</p>
      <a class="button" th:href="@{/}">목록으로 돌아가기</a>
    </main>
  </body>
</html>
